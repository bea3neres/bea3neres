<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 360" width="280" height="360">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3d81"/>
      <stop offset=".5" stop-color="#ff8a1f"/>
      <stop offset="1" stop-color="#7b2ff7"/>
    </linearGradient>
    <linearGradient id="av" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff3d81"/><stop offset="1" stop-color="#ffb37a"/>
    </linearGradient>
    <filter id="g" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="16"/></filter>
    <clipPath id="screen"><rect x="58" y="22" width="164" height="316" rx="24"/></clipPath>
  </defs>

  <g font-family="'Helvetica Neue', Helvetica, 'Segoe UI', Arial, sans-serif">
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="6s" repeatCount="indefinite"/>
    <rect x="58" y="22" width="164" height="316" rx="26" fill="url(#edge)" opacity=".35" filter="url(#g)"/>
    <rect x="52" y="16" width="176" height="328" rx="30" fill="#14161f" stroke="url(#edge)" stroke-width="2"/>
    <g clip-path="url(#screen)">
      <rect x="58" y="22" width="164" height="316" fill="#0b0d14"/>
      <!-- topo da conversa -->
      <rect x="58" y="22" width="164" height="58" fill="#12151f"/>
      <rect x="118" y="30" width="44" height="6" rx="3" fill="#000"/>
      <circle cx="80" cy="60" r="11" fill="url(#av)"/>
      <text x="80" y="64" text-anchor="middle" font-size="11" fill="#0b0d14" font-weight="700">✂</text>
      <text x="98" y="58" font-size="11" font-weight="700" fill="#f4f1fb">Studio</text>
      <text x="98" y="71" font-size="9" fill="#3ddc97">mensagem automática</text>

      <!-- 1: lembrete -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.04;.08;.92;1" dur="10s" repeatCount="indefinite"/>
        <rect x="66" y="92" width="132" height="74" rx="10" fill="#1c2030"/>
        <text font-size="9.5" fill="#e6e2f2">
          <tspan x="74" y="108">Oi, Maria! 💇‍♀️ Seu horário</tspan>
          <tspan x="74" y="121">é amanhã às 14h.</tspan>
          <tspan x="74" y="138" fill="#ffb37a">1 · confirmar</tspan>
          <tspan x="74" y="151" fill="#ffb37a">2 · remarcar</tspan>
        </text>
        <text x="190" y="161" text-anchor="end" font-size="7" fill="#7d8499">09:00</text>
      </g>
      <!-- 2: resposta -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.28;.32;.92;1" dur="10s" repeatCount="indefinite"/>
        <rect x="176" y="176" width="38" height="26" rx="10" fill="#ff3d81"/>
        <text x="195" y="193" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">1</text>
      </g>
      <!-- digitando -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.4;.43;.54;.56;1" dur="10s" repeatCount="indefinite"/>
        <rect x="66" y="212" width="44" height="22" rx="10" fill="#1c2030"/>
        <circle cx="78" cy="223" r="2.5" fill="#9aa3b8"><animate attributeName="opacity" values="1;.3;1" dur="1s" repeatCount="indefinite"/></circle>
        <circle cx="88" cy="223" r="2.5" fill="#9aa3b8"><animate attributeName="opacity" values=".3;1;.3" dur="1s" repeatCount="indefinite"/></circle>
        <circle cx="98" cy="223" r="2.5" fill="#9aa3b8"><animate attributeName="opacity" values="1;.3;1" dur="1s" repeatCount="indefinite"/></circle>
      </g>
      <!-- 3: confirmação -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.56;.6;.92;1" dur="10s" repeatCount="indefinite"/>
        <rect x="66" y="212" width="132" height="48" rx="10" fill="#1c2030"/>
        <text font-size="9.5" fill="#e6e2f2">
          <tspan x="74" y="228">Confirmado! ✅</tspan>
          <tspan x="74" y="241">Te esperamos amanhã 💖</tspan>
        </text>
        <text x="190" y="255" text-anchor="end" font-size="7" fill="#7d8499">09:02</text>
      </g>
      <!-- selo -->
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.68;.72;.92;1" dur="10s" repeatCount="indefinite"/>
        <rect x="84" y="284" width="112" height="22" rx="11" fill="#3ddc97" fill-opacity=".12" stroke="#3ddc97" stroke-opacity=".5"/>
        <text x="140" y="299" text-anchor="middle" font-size="9" font-weight="700" fill="#3ddc97" letter-spacing=".5">AGENDA ATUALIZADA</text>
      </g>
    </g>
  </g>
</svg>
